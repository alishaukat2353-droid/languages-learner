<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Japanese Words</title>
<style>
  :root {
    --bg: #f6f7f4;
    --panel: #ffffff;
    --ink: #1d2a2a;
    --muted: #6b7878;
    --line: #dde3e0;
    --accent: #1f6f6b;
    --soft: #eaf3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141b1b;
      --panel: #1d2626;
      --ink: #e8efee;
      --muted: #93a3a2;
      --line: #2c3939;
      --accent: #5fc2bb;
      --soft: #223030;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }

  input, select {
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input { width: 100%; min-width: 0; }
  input:focus-visible, button:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    font: inherit;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
  }

  .bar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 8px; }
  .msgbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .msg { flex: 1; min-width: 0; min-height: 1.4em; font-size: .88rem; color: var(--muted); }
  .danger {
    background: transparent;
    color: #c0392b;
    border: 1px solid #c0392b;
    padding: 6px 12px;
    font-size: .85rem;
    white-space: nowrap;
  }
  .danger:hover { background: rgba(192, 57, 43, .1); }
  @media (prefers-color-scheme: dark) {
    .danger { color: #ff8a7a; border-color: #ff8a7a; }
    .danger:hover { background: rgba(255, 138, 122, .12); }
  }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .row {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 4px 12px;
    align-items: center;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cell .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .jp .txt { font-size: 1.15rem; }
  .word .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .romaji .txt { color: var(--muted); font-size: 1rem; padding-left: 4px; }
  .head {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 12px;
    padding: 0 10px 2px;
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .head[hidden] { display: none; }
  .head span:nth-child(2) { padding-left: 38px; }
  .head span:nth-child(3) { padding-left: 38px; }
  .badge {
    font-size: .68rem;
    font-weight: 700;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    color: var(--accent);
    background: var(--soft);
  }

  .say, .dots, .menu button {
    background: transparent;
    color: var(--accent);
    padding: 6px 8px;
    font-size: 1.05rem;
    line-height: 1;
  }
  .say:hover, .dots:hover { background: var(--soft); }
  .dots { font-size: 1.3rem; font-weight: 700; color: var(--muted); }

  .menu {
    position: absolute;
    left: calc(55% - 90px);
    top: 44px;
    z-index: 5;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    min-width: 150px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
  }
  .menu[hidden], .sent[hidden] { display: none; }
  .menu button { width: 100%; text-align: left; font-size: .95rem; font-weight: 500; color: var(--ink); border-radius: 6px; }
  .menu button:hover { background: var(--soft); }

  .sent {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 8px 10px;
    background: var(--soft);
    border-radius: 8px;
  }
  .sent .cell + .cell { margin-top: 2px; }
  .sent .jp .txt { font-size: 1.05rem; }
  .sent .en .txt { color: var(--muted); font-size: .95rem; }
  .sent .none { color: var(--muted); font-size: .92rem; }

  .empty { padding: 24px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

  @media (max-width: 560px) {
    .bar { grid-template-columns: 1fr auto; }
    .bar select { grid-column: 1; }
    .bar button { grid-column: 2; grid-row: 1 / span 2; }
    .row { gap: 4px 6px; padding: 8px 6px; }
    .head { gap: 6px; padding: 0 6px 2px; font-size: .68rem; }
    .head span:nth-child(2), .head span:nth-child(3) { padding-left: 30px; }
    .romaji .txt { font-size: .9rem; padding-left: 0; }
    .jp .txt { font-size: 1.05rem; }
    .say, .dots { padding: 6px 4px; }
    .menu { left: 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>My Japanese Words</h1>

  <div class="bar">
    <input id="search" type="search" placeholder="Search in Japanese or romaji" autocomplete="off">
    <select id="searchBy" aria-label="Search language">
      <option value="jp" selected>Japanese</option>
      <option value="en">English</option>
    </select>
    <button type="button" id="addBtn">Add</button>
  </div>
  <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
  <div class="msgbar">
    <div class="msg" id="msg" role="status"></div>
    <button type="button" class="danger" id="delAllBtn" hidden>Delete all</button>
  </div>

  <div class="head" id="head"><span>Jap Eng</span><span>Japanese</span><span>English</span></div>
  <div class="list" id="list"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const KEY = "japaneseWordsV2";
  const $ = id => document.getElementById(id);
  let words = [];   // { jp, en, s, se }  (s = sentence in Japanese, se = sentence in English)

  try { words = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { words = []; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(words)); } catch (e) {}
  }

  function say(text) { $("msg").textContent = text; }

  // ---------- Audio (voices built into the browser / device) ----------
  function scoreVoice(v) {
    const n = v.name.toLowerCase();
    let s = 0;
    if (/natural|neural/.test(n)) s += 100;
    if (/online/.test(n)) s += 50;
    if (/google/.test(n)) s += 40;
    if (!v.localService) s += 10;
    return s;
  }
  function bestVoice(prefix) {
    if (!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices()
      .filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(prefix))
      .sort((a, b) => scoreVoice(b) - scoreVoice(a));
    return vs[0] || null;
  }
  function speak(text, lang) {
    const t = String(text).trim();
    if (!t) return;
    if (!("speechSynthesis" in window)) { say("This browser cannot play audio."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = lang === "ja" ? "ja-JP" : "en-US";
    u.rate = lang === "ja" ? 0.85 : 0.95;
    const v = bestVoice(lang);
    if (v) u.voice = v;
    else if (lang === "ja") say("No Japanese voice found on this device. Add the Japanese language pack (with speech) in your system settings.");
    speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  // ---------- Reading the Excel file ----------
  // Finds the header row (first 15 rows) and the columns:
  //   Japanese (romaji) | Pure Japanese | Type (h / k / kj) | English | Sentence Japanese | Sentence English
  function findColumns(rows) {
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const map = {};
      (rows[r] || []).forEach((c, i) => {
        const h = String(c).toLowerCase().trim();
        if (!h) return;
        const isSentence = /sentence|example/.test(h);
        if (isSentence && /english|translat|meaning|\ben\b/.test(h)) { if (map.se === undefined) map.se = i; }
        else if (isSentence) { if (map.s === undefined) map.s = i; }
        else if (/pure|actual|written|hiragana|katakana|kanji|kana/.test(h)) { if (map.pj === undefined) map.pj = i; }
        else if (/^type$|pointer|script|^h\/k/.test(h)) { if (map.ty === undefined) map.ty = i; }
        else if (/japanese|romaji|roman|^jp$/.test(h)) { if (map.ro === undefined) map.ro = i; }
        else if (/english|^en$/.test(h)) { if (map.en === undefined) map.en = i; }
      });
      if (map.en !== undefined && (map.ro !== undefined || map.pj !== undefined)) return { row: r, map };
    }
    return null;
  }

  // h = hiragana, k = katakana, kj = kanji
  function normType(t) {
    const x = String(t).toLowerCase().trim();
    if (x === "h" || x === "hiragana") return "h";
    if (x === "k" || x === "katakana") return "k";
    if (x === "kj" || x === "kanji") return "kj";
    return "";
  }
  function scriptType(str) {
    const t = String(str).replace(/ー/g, "");
    if (/[\u4e00-\u9fff]/.test(t)) return "kj";
    const hasH = /[\u3040-\u309f]/.test(t), hasK = /[\u30a0-\u30ff]/.test(t);
    if (hasK && !hasH) return "k";
    if (hasH) return "h";
    return "";
  }
  const TYPE_NAME = { h: "Hiragana", k: "Katakana", kj: "Kanji" };

  function importRows(rows) {
    const found = findColumns(rows);
    if (!found) {
      say("Could not find the column names. The first row needs \"Japanese\", \"Pure Japanese\" and \"English\" (and optionally \"Type\", \"Sentence Japanese\" and \"Sentence English\").");
      return;
    }
    const m = found.map;
    const cell = (r, k) => (m[k] === undefined ? "" : String(r[m[k]] ?? "").trim());

    const key = w => [w.ro, w.jp, w.en, w.s].join("\u0000");
    const seen = new Set(words.map(key));
    const added = [];
    let skipped = 0;
    rows.slice(found.row + 1).forEach(r => {
      const rom = cell(r, "ro"), pure = cell(r, "pj");
      // Old files without a "Pure Japanese" column: the Japanese column is the word itself
      const w = m.pj === undefined
        ? { jp: rom, ro: "", en: cell(r, "en"), s: cell(r, "s"), se: cell(r, "se") }
        : { jp: pure, ro: rom, en: cell(r, "en"), s: cell(r, "s"), se: cell(r, "se") };
      if (!w.jp && !w.ro && !w.en) return;      // empty row
      if ((!w.jp && !w.ro) || !w.en) { skipped++; return; }
      w.t = normType(cell(r, "ty")) || scriptType(w.jp);
      const k = key(w);
      if (seen.has(k)) { skipped++; return; }
      seen.add(k);
      added.push(w);
    });

    words = words.concat(added);
    save();
    render();
    say("Added " + added.length + " words" + (skipped ? ", skipped " + skipped + " (duplicates or incomplete rows)" : "") + ".");
  }

  function readFile(file) {
    if (typeof XLSX === "undefined") {
      say("The Excel reader did not load. Check your internet connection and reload the page.");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => say("Could not read that file.");
    try {
      if (/\.csv$/i.test(file.name)) {
        reader.onload = () => {
          try {
            const wb = XLSX.read(String(reader.result), { type: "string" });
            importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }));
          } catch (e) { say("Could not read that file."); }
        };
        reader.readAsText(file, "UTF-8");
      } else {
        reader.onload = () => {
          try {
            const wb = XLSX.read(reader.result, { type: "array" });
            importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }));
          } catch (e) { say("Could not read that file. Is it a valid Excel file?"); }
        };
        reader.readAsArrayBuffer(file);
      }
    } catch (e) { say("Could not read that file."); }
  }

  $("addBtn").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) readFile(f);
    e.target.value = "";
  });

  // ---------- Delete all ----------
  $("delAllBtn").addEventListener("click", () => {
    if (!words.length) return;
    const n = words.length;
    if (!confirm("Delete all " + n + " words? This cannot be undone.")) return;
    words = [];
    save();
    $("search").value = "";
    render();
    say("Deleted all " + n + " words.");
  });

  // ---------- List ----------
  const LIMIT = 500;

  // Lowercase and drop Latin accents/macrons (ō -> o); Japanese characters stay intact
  function norm(s) {
    return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC").toLowerCase();
  }

  function makeCell(cls, text, sayKey, withDots) {
    const c = document.createElement("div");
    c.className = "cell " + cls;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "say";
    b.dataset.say = sayKey;
    b.textContent = "🔊";
    b.setAttribute("aria-label", "Play audio");
    const t = document.createElement("span");
    t.className = "txt";
    t.textContent = text;
    c.append(b, t);
    if (withDots) {
      const d = document.createElement("button");
      d.type = "button";
      d.className = "dots";
      d.textContent = "⋮";
      d.setAttribute("aria-label", "More options");
      d.setAttribute("aria-haspopup", "menu");
      c.appendChild(d);
    }
    return c;
  }

  // Returns two cells: romaji (e.g. arigato) and real Japanese (e.g. ありがとう)
  function makeWordCells(w) {
    const rc = document.createElement("div");
    rc.className = "cell romaji";
    const rt = document.createElement("span");
    rt.className = "txt";
    rt.textContent = w.ro || "";
    rc.appendChild(rt);

    const c = makeCell("jp word", "", "jp", true);
    const t = c.querySelector(".txt");
    const big = document.createElement("span");
    big.className = "big";
    const main = document.createElement("span");
    main.textContent = w.jp || w.ro;
    big.appendChild(main);
    const type = w.t || scriptType(w.jp);
    if (type && w.jp) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = type;
      b.title = TYPE_NAME[type];
      big.appendChild(b);
    }
    t.appendChild(big);
    return [rc, c];
  }

  function render() {
    const q = norm($("search").value.trim());
    const by = $("searchBy").value;
    const list = $("list");
    list.innerHTML = "";
    $("delAllBtn").hidden = !words.length;
    $("head").hidden = !words.length;

    const matches = [];
    words.forEach((w, i) => {
      if (!q || norm(by === "jp" ? w.jp + " " + (w.ro || "") : w.en).includes(q)) matches.push(i);
    });

    if (!matches.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = words.length ? "No match found." : "No words yet. Tap Add and choose your Excel file.";
      list.appendChild(d);
      return;
    }

    const frag = document.createDocumentFragment();
    matches.slice(0, LIMIT).forEach(i => {
      const w = words[i];
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.i = i;

      const menu = document.createElement("div");
      menu.className = "menu";
      menu.hidden = true;
      menu.setAttribute("role", "menu");
      const item = document.createElement("button");
      item.type = "button";
      item.dataset.act = "sentences";
      item.textContent = "Sentences";
      item.setAttribute("role", "menuitem");
      menu.appendChild(item);

      row.append(...makeWordCells(w), makeCell("en", w.en, "en", false), menu);
      frag.appendChild(row);
    });
    list.appendChild(frag);

    if (matches.length > LIMIT) {
      const note = document.createElement("div");
      note.className = "empty";
      note.textContent = "Showing the first " + LIMIT + " of " + matches.length + " matches. Use the search bar to find the rest.";
      list.appendChild(note);
    }
  }

  function closeMenus() {
    document.querySelectorAll(".menu").forEach(m => { m.hidden = true; });
  }

  function toggleSentences(row, w) {
    let panel = row.querySelector(".sent");
    const item = row.querySelector('[data-act="sentences"]');
    if (panel) {
      panel.hidden = !panel.hidden;
      item.textContent = panel.hidden ? "Sentences" : "Hide sentences";
      return;
    }
    panel = document.createElement("div");
    panel.className = "sent";
    if (w.s || w.se) {
      if (w.s) panel.appendChild(makeCell("jp", w.s, "sjp", false));
      if (w.se) panel.appendChild(makeCell("en", w.se, "sen", false));
    } else {
      const n = document.createElement("div");
      n.className = "none";
      n.textContent = "No sentence for this word in your file.";
      panel.appendChild(n);
    }
    row.appendChild(panel);
    item.textContent = "Hide sentences";
  }

  $("list").addEventListener("click", e => {
    const row = e.target.closest(".row");
    if (!row) return;
    const w = words[Number(row.dataset.i)];
    if (!w) return;

    const sayBtn = e.target.closest(".say");
    if (sayBtn) {
      const k = sayBtn.dataset.say;
      if (k === "jp") speak(w.jp || w.ro, "ja");
      else if (k === "en") speak(w.en, "en");
      else if (k === "sjp") speak(w.s, "ja");
      else if (k === "sen") speak(w.se, "en");
      return;
    }

    if (e.target.closest(".dots")) {
      e.stopPropagation();
      const menu = row.querySelector(".menu");
      const wasHidden = menu.hidden;
      closeMenus();
      menu.hidden = !wasHidden;
      return;
    }

    if (e.target.closest('[data-act="sentences"]')) {
      toggleSentences(row, w);
      closeMenus();
    }
  });

  document.addEventListener("click", e => { if (!e.target.closest(".dots")) closeMenus(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });

  // ---------- Search ----------
  $("search").addEventListener("input", render);
  $("searchBy").addEventListener("change", () => {
    $("search").placeholder = $("searchBy").value === "jp" ? "Search in Japanese or romaji" : "Search in English";
    render();
  });

  render();
</script>
</body>
</html>
